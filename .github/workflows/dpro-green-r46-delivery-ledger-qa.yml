name: DPRO GREEN R4.6 Delivery Ledger Local Supabase QA
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r46-delivery-ledger-qa
  cancel-in-progress: false
jobs:
  r46-local-delivery-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.121.0
      - name: Ensure local PostgreSQL client
        shell: bash
        run: if ! command -v psql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
      - name: Run isolated GREEN preflight invite and delivery ledger QA
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS:-}" == 'true' ]] || { echo 'GitHub Actions only'; exit 65; }
