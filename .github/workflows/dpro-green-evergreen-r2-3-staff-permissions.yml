name: DPRO GREEN EVERGREEN R2.3 Staff Permissions

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-green-evergreen-r2-3-staff-permissions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Staff FACT LOCK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object staff.js)" = "7c4e582c94707d15b1841784fdefd257ac609515"
          test "$(git hash-object staff.html)" = "f1d079224d158382aeae753fab07d0ae772fbfd4"
          echo "STAFF FACT LOCK OK"

      - name: Apply R2.3 staff permission patch
        shell: bash
        env:
          DPRO_PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$DPRO_PATCH_B64" | base64 --decode > /tmp/dpro_green_r2_3_staff_patch.py
          python /tmp/dpro_green_r2_3_staff_patch.py

      - name: Verify R2.3 files
        shell: bash
        run: |
          set -euo pipefail
          node --check staff.js
          grep -F 'DPRO GREEN EVERGREEN STAFF PERMISSION R2.3' staff.js
          grep -F 'canViewInternalNotes===true' staff.js
          grep -F 'canViewAddress===true' staff.js
          grep -F 'canViewEntryInfo===true' staff.js
          grep -F 'GREEN-EVG-STAFF-R2.3-20260923' staff.html
          git diff --check

      - name: Commit application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO GREEN Evergreen"
          git config user.email "actions@users.noreply.github.com"
          git add staff.js staff.html
          git commit -m "Respect GREEN staff visibility permissions"
          git push origin HEAD:main
