name: DPRO GREEN R1.9 Disposable PostgreSQL QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: green-r19-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pg17-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-r19-runner-only
          POSTGRES_DB: green_r19_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d green_r19_disposable"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-r19-runner-only
      PGDATABASE: green_r19_disposable
    steps:
      - name: Install local PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Decode checked ephemeral fixture (no external source)
        shell: bash
        run: |
          set -euo pipefail
