name: DPRO GREEN R1.9.2 Owner Cancel Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-green-r1-9-2-owner-cancel-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply R1.9.2 minimal owner patch
        shell: python
        run: |
          from pathlib import Path

          feature = Path("feature-settings.js")
          owner = Path("owner.html")
          f = feature.read_text(encoding="utf-8")
          h = owner.read_text(encoding="utf-8")

          # Version marker
          if "GREEN-EVERGREEN-OWNER-R1.9.2-20260922" not in f:
              f = f.replace(
                  "OWNER COMMON BRUSHUP R1.9.1 / 2026-09-22",
                  "OWNER COMMON BRUSHUP R1.9.2 / 2026-09-22",
                  1,
              )
              f = f.replace(
                  'GREEN-EVERGREEN-OWNER-R1.9.1-20260922',
                  'GREEN-EVERGREEN-OWNER-R1.9.2-20260922',
                  1,
              )

          # Exact site-area footer only.
          old_footer = '    footer.innerHTML = `\n      <button type="button" class="btn btn--secondary" data-dialog-close>取消</button>\n      <button type="button" class="btn btn--primary" id="green-site-area-save">更新</button>\n    `;'
          new_footer = '    footer.innerHTML = `\n      <button type="button" class="btn btn--secondary" id="green-site-area-cancel" data-dialog-close>取消</button>\n      <button type="button" class="btn btn--primary" id="green-site-area-save">更新</button>\n    `;'
          if old_footer in f:
              f = f.replace(old_footer, new_footer, 1)
          elif new_footer not in f:
              raise SystemExit("ABORT: exact site-area footer not found")

          # Add a deterministic close handler AFTER the existing generic dirty-check
          # handler. If the user chooses Cancel in the confirm dialog, the generic
          # handler stops propagation and this handler never runs. If the user
          # chooses OK, this handler closes the dialog.
          sentinel = 'button.id === "green-site-area-cancel"'
          if sentinel not in f:
              marker = '  dialog.addEventListener("cancel", (event) => {'
              if marker not in f:
                  raise SystemExit("ABORT: dialog cancel marker not found")
              special = (
                  '  document.addEventListener("click", (event) => {\n'
                  '    const button = event.target.closest?.("button");\n'
                  '    if (!button || button.id !== "green-site-area-cancel" || !dialog.contains(button)) return;\n'
                  '    event.preventDefault();\n'
                  '    event.stopImmediatePropagation();\n'
                  '    state.dirtyAny = false;\n'
                  '    state.dirtyMain = false;\n'
                  '    dialog.close();\n'
                  '  }, true);\n\n'
              )
              f = f.replace(marker, special + marker, 1)

          # Cache-bust on GitHub Pages.
          old_script = '<script src="feature-settings.js"></script>'
          new_script = '<script src="feature-settings.js?v=GREEN-EVG-OWNER-R1.9.2-20260922"></script>'
          if old_script in h:
              h = h.replace(old_script, new_script, 1)
          elif new_script not in h:
              raise SystemExit("ABORT: owner.html feature-settings script tag not found")

          feature.write_text(f, encoding="utf-8")
          owner.write_text(h, encoding="utf-8")

      - name: Verify R1.9.2 patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'GREEN-EVERGREEN-OWNER-R1.9.2-20260922' feature-settings.js
          grep -F 'id="green-site-area-cancel"' feature-settings.js
          grep -F 'button.id !== "green-site-area-cancel"' feature-settings.js
          grep -F 'feature-settings.js?v=GREEN-EVG-OWNER-R1.9.2-20260922' owner.html
          git diff --check

      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO GREEN Evergreen Fix"
          git config user.email "actions@users.noreply.github.com"
          git rm -- ".github/workflows/dpro-green-r1-9-2-owner-cancel-fix.yml"
          git add feature-settings.js owner.html
          git commit -m "Fix GREEN R1.9.2 site area cancel and cache"
          git push origin HEAD:main
