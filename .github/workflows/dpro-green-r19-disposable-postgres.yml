        shell: bash
        run: bash "$RUNNER_TEMP/dpro-green-r19/R19_RUN.sh"
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### DPRO GREEN R1.9 - Synthetic PostgreSQL verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ephemeral PostgreSQL 17 only. No live Supabase, secrets, customer data, oauth, payments, deploy or DDL in production.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Pass means synthetic fixture check, not production authorization.' >> "$GITHUB_STEP_SUMMARY"
