name: DPRO GREEN Demo Blog CMS R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add safe demo blog CMS
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os, base64
          exec(compile(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"),"green_demo_blog_cms_r1.py","exec"))
      - name: Validate
        shell: bash
        run: |
          node --check owner.js
          node --check green-owner-flow.js
          node --check green-demo-blog-r1.js
          grep -q 'data-view="blog"' owner.html
          grep -q 'data-view-panel="blog"' owner.html
          grep -q 'DPRO GREEN DEMO BLOG CMS R1' green-demo-blog-r1.css
          grep -q '"announcements", "blog", "features"' green-owner-flow.js
      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/dpro-green-demo-blog-cms-r1.yml
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add safe GREEN blog CMS public demo"
          git push
