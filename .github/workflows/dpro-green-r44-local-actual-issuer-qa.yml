name: DPRO GREEN R4.4 Local Actual Issuer Supabase QA
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r44-local-actual-issuer
  cancel-in-progress: false
jobs:
  r44-actual-issuer:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.121.0
      - name: Ensure disposable PostgreSQL client is available
        shell: bash
        run: if ! command -v psql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
      - name: Run local Supabase gateway against real R39 schema and guarded R42 RPC
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != "true" ]]; then echo 'Refused outside GitHub Actions'; exit 65; fi
