name: DPRO GREEN DEMO FC Common Sync R48

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEMO
        uses: actions/checkout@v4

      - name: Fetch locked R48 sources
        shell: bash
        run: |
          rm -rf /tmp/green-prod /tmp/green-web
          git clone --quiet https://github.com/dpromstk2000-lab/dpro-cl-000001-green.git /tmp/green-prod
          git -C /tmp/green-prod checkout --quiet 58af787c2e6c664722dc1c52a6495f76b2ac7258
          git clone --quiet https://github.com/dpromstk2000-lab/dpro-green-website.git /tmp/green-web
          git -C /tmp/green-web checkout --quiet 9b333cb7f41d64f6901ac96c5e08a4bda8aa2e14

      - name: Copy FC-common frontend modules only
        shell: bash
        run: |
          set -euo pipefail
          for f in green-owner-species-list-r1.js green-owner-atlas-status-r1.js green-owner-atlas-image-manager-r1.js green-owner-session-idle60-r1.js green-return-location-fix-r1.js green-site-check-native-tabs-r3.js green-date-picker-fix-r1.js green-visit-rule-monthly-count-r3.js green-staff-auth-r1.js green-contact-primary-ui-r1.js green-datetime-standard-r1.js green-liff-richmenu-router-r2.js green-contact-standard-r3.css green-contact-standard-r3.js green-contact-zero-jump-r4.css green-contact-zero-jump-r4.js green-contact-send-confirm-r1.js green-contact-manual-refresh-read-r1.js; do
            test -f "/tmp/green-prod/$f"
            cp "/tmp/green-prod/$f" "$f"
          done

      - name: Copy all 96 Atlas images
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/green-web -maxdepth 1 -type f -name 'atlas-*.png' -exec cp {} . \;
          find /tmp/green-prod -maxdepth 1 -type f -name 'atlas-*.png' -exec cp {} . \;
          count=$(find . -maxdepth 1 -type f -name 'atlas-*.png' | wc -l | tr -d ' ')
          echo "Atlas image count=$count"
          test "$count" -eq 96

      - name: Write FC-common DEMO loader
        shell: python
        env:
          GREEN_FC_LOADER_B64: ""
        run: |
          import os, base64
          from pathlib import Path
          Path("green-fc-common-demo-r48.js").write_bytes(base64.b64decode(os.environ["GREEN_FC_LOADER_B64"]))

      - name: Activate loader without overwriting DEMO config
        shell: python
        env:
          GREEN_FC_ACTIVATION_B64: ""
        run: |
          import os, base64
          from pathlib import Path
          path=Path("config.js")
          text=path.read_text()
          marker="DPRO GREEN DEMO FC COMMON R48 / activated 2026-10-04"
          if marker not in text:
              loader=base64.b64decode(os.environ["GREEN_FC_ACTIVATION_B64"]).decode()
              path.write_text(text.rstrip()+loader+"\n")

      - name: Guard against Kasuya-specific IDs
        shell: bash
        run: |
          set -euo pipefail
          files="green-fc-common-demo-r48.js green-owner-species-list-r1.js green-owner-atlas-status-r1.js green-owner-atlas-image-manager-r1.js green-owner-session-idle60-r1.js green-return-location-fix-r1.js green-site-check-native-tabs-r3.js green-date-picker-fix-r1.js green-visit-rule-monthly-count-r3.js green-staff-auth-r1.js green-contact-primary-ui-r1.js green-datetime-standard-r1.js green-liff-richmenu-router-r2.js green-contact-standard-r3.css green-contact-standard-r3.js green-contact-zero-jump-r4.css green-contact-zero-jump-r4.js green-contact-send-confirm-r1.js green-contact-manual-refresh-read-r1.js"
          if grep -nE 'cl_000001_green|2011750460-EpN149VY|dpro-cl-000001-green-(core|shop|line)' $files; then
            echo "Kasuya-specific identifier detected. Abort."
            exit 1
          fi
          grep -q 'FACILITY_CODE: "dpro_green_rental_demo"' config.js
          grep -q 'dpro-green-rental-line-api.dpromstk2000.workers.dev' config.js

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check config.js
          node --check green-fc-common-demo-r48.js
          for f in green-owner-species-list-r1.js green-owner-atlas-status-r1.js green-owner-atlas-image-manager-r1.js green-owner-session-idle60-r1.js green-return-location-fix-r1.js green-site-check-native-tabs-r3.js green-date-picker-fix-r1.js green-visit-rule-monthly-count-r3.js green-staff-auth-r1.js green-contact-primary-ui-r1.js green-datetime-standard-r1.js green-liff-richmenu-router-r2.js green-contact-standard-r3.css green-contact-standard-r3.js green-contact-zero-jump-r4.css green-contact-zero-jump-r4.js green-contact-send-confirm-r1.js green-contact-manual-refresh-read-r1.js; do
            case "$f" in *.js) node --check "$f" ;; esac
          done

      - name: Commit FC-common sync
        shell: bash
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js green-fc-common-demo-r48.js green-owner-species-list-r1.js green-owner-atlas-status-r1.js green-owner-atlas-image-manager-r1.js green-owner-session-idle60-r1.js green-return-location-fix-r1.js green-site-check-native-tabs-r3.js green-date-picker-fix-r1.js green-visit-rule-monthly-count-r3.js green-staff-auth-r1.js green-contact-primary-ui-r1.js green-datetime-standard-r1.js green-liff-richmenu-router-r2.js green-contact-standard-r3.css green-contact-standard-r3.js green-contact-zero-jump-r4.css green-contact-zero-jump-r4.js green-contact-send-confirm-r1.js green-contact-manual-refresh-read-r1.js atlas-*.png
          git commit -m "Sync GREEN DEMO to FC common R48 frontend"
          git push
