name: DPRO GREEN R3.2 Supabase-style RLS and Grants PG17 QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r32-${{ github.ref }}
  cancel-in-progress: true
jobs:
  r32-isolated-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-r32-only
          POSTGRES_DB: green_r32_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d green_r32_disposable"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-r32-only
      PGDATABASE: green_r32_disposable
    steps:
      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Verify isolated bundle and run PostgreSQL permissions QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/green-r32"
