name: DPRO GREEN EVERGREEN R2 Settings UX Retry

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-green-evergreen-r2-settings-ux-retry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify application FACT LOCK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object feature-settings.js)" = "b551cdbd582cbde98055832d45c40b0856b1c7b9"
          test "$(git hash-object owner.css)" = "9fd7f945612a8b902030baf31c8d1b7d225882a9"
          test "$(git hash-object owner.html)" = "0d0d9ee916dd6e83870c957e29c2281505092c42"
          echo "FACT LOCK OK: application files still match GREEN R1.9.3 baseline"

      - name: Apply R2 minimum patch
        shell: bash
        env:
          DPRO_PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$DPRO_PATCH_B64" | base64 --decode > /tmp/dpro_green_r2_patch.py
          python /tmp/dpro_green_r2_patch.py

      - name: Verify R2 files
        shell: bash
        run: |
          set -euo pipefail
          node --check feature-settings.js
          grep -F 'GREEN-EVERGREEN-OWNER-R2.0-20260923' feature-settings.js
          grep -F 'feature-settings-shell' feature-settings.js
          grep -F '未保存の変更があります' feature-settings.js
          grep -F '保存中です…' feature-settings.js
          grep -F '更新中…' feature-settings.js
          grep -F '設置場所を更新できませんでした' feature-settings.js
          grep -F 'DPRO GREEN EVERGREEN R2 SETTINGS UX' owner.css
          grep -F 'owner.css?v=GREEN-EVG-R2-20260923' owner.html
          grep -F 'feature-settings.js?v=GREEN-EVG-OWNER-R2.0-20260923' owner.html
          git diff --check

      - name: Commit application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO GREEN Evergreen"
          git config user.email "actions@users.noreply.github.com"
          git add feature-settings.js owner.css owner.html
          git commit -m "Brush up GREEN R2 settings and mutation UX"
          git push origin HEAD:main
