name: DPRO GREEN R3.7 Durable Invite Delivery PostgreSQL QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r37-${{ github.ref }}
  cancel-in-progress: true
jobs:
  r37-durable-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-r37-only
          POSTGRES_DB: green_r37_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d green_r37_disposable"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-r37-only
      PGDATABASE: green_r37_disposable
    steps:
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Restore verified synthetic QA bundle
