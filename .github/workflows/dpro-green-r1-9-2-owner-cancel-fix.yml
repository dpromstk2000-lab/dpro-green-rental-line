name: DPRO GREEN R1.9.2 Owner Cancel Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-green-r1-9-2-owner-cancel-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply R1.9.2 minimal owner patch
        shell: python
        run: |
          from pathlib import Path

          feature = Path("feature-settings.js")
          owner = Path("owner.html")
          f = feature.read_text(encoding="utf-8")
          h = owner.read_text(encoding="utf-8")

          # Version marker
          f = f.replace(
              "OWNER COMMON BRUSHUP R1.9.1 / 2026-09-22",
              "OWNER COMMON BRUSHUP R1.9.2 / 2026-09-22",
              1,
          )
          f = f.replace(
              'GREEN-EVERGREEN-OWNER-R1.9.1-20260922',
              'GREEN-EVERGREEN-OWNER-R1.9.2-20260922',
              1,
          )

          # Give the dynamically-created footer cancel button an exact id.
          old_button = '<button type="button" class="btn btn--secondary" data-dialog-close>取消</button>\n      <button type="button" class="btn btn--primary" id="green-site-area-save">更新</button>'
          new_button = '<button type="button" class="btn btn--secondary" id="green-site-area-cancel" data-dialog-close>取消</button>\n      <button type="button" class="btn btn--primary" id="green-site-area-save">更新</button>'
          if old_button in f:
              f = f.replace(old_button, new_button, 1)
          elif new_button not in f:
              raise SystemExit("ABORT: site-area footer block not found")

          # Remove the R1.9.1 direct binding; R1.9.2 handles this in the
          # capture handler so confirmed discard always closes deterministically.
          old_bind = '''    const form = $("#green-site-area-edit-form", dialog);
              const save = $("#green-site-area-save", dialog);
              const cancel = $("[data-dialog-close]", dialog);

              // R1.9.1: this footer is replaced after owner.js binds its close handlers.
              // Bind the dynamic cancel button so confirmed unsaved discard closes the dialog.
              cancel?.addEventListener("click", () => dialog.close());

              save?.addEventListener("click", async () => {'''
          new_bind = '''    const form = $("#green-site-area-edit-form", dialog);
              const save = $("#green-site-area-save", dialog);

              save?.addEventListener("click", async () => {'''
          if old_bind in f:
              f = f.replace(old_bind, new_bind, 1)

          old_handler = '''    const closing = button.id === "dialog-close" ||
              button.id === "dialog-cancel" ||
              button.hasAttribute("data-dialog-close");

            const liveDirty = computeDirtyState().dirtyAny;
            state.dirtyAny = liveDirty;

            if (closing && liveDirty) {
              const ok = window.confirm("未保存の変更があります。保存せずに閉じますか？");
              if (!ok) {
                event.preventDefault();
                event.stopImmediatePropagation();
              }
            }'''
          new_handler = '''    const siteAreaCancel = button.id === "green-site-area-cancel";
            const closing = button.id === "dialog-close" ||
              button.id === "dialog-cancel" ||
              button.hasAttribute("data-dialog-close");

            const liveDirty = computeDirtyState().dirtyAny;
            state.dirtyAny = liveDirty;

            if (closing && liveDirty) {
              const ok = window.confirm("未保存の変更があります。保存せずに閉じますか？");
              if (!ok) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return;
              }
            }

            if (siteAreaCancel) {
              event.preventDefault();
              event.stopImmediatePropagation();
              state.dirtyAny = false;
              state.dirtyMain = false;
              dialog.close();
              return;
            }'''
          if old_handler in f:
              f = f.replace(old_handler, new_handler, 1)
          elif 'const siteAreaCancel = button.id === "green-site-area-cancel";' not in f:
              raise SystemExit("ABORT: close handler block not found")

          # Cache-bust the evergreen JS on GitHub Pages.
          old_script = '<script src="feature-settings.js"></script>'
          new_script = '<script src="feature-settings.js?v=GREEN-EVG-OWNER-R1.9.2-20260922"></script>'
          if old_script in h:
              h = h.replace(old_script, new_script, 1)
          elif new_script not in h:
              raise SystemExit("ABORT: owner.html feature-settings script tag not found")

          feature.write_text(f, encoding="utf-8")
          owner.write_text(h, encoding="utf-8")

      - name: Verify R1.9.2 patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'GREEN-EVERGREEN-OWNER-R1.9.2-20260922' feature-settings.js
          grep -F 'id="green-site-area-cancel"' feature-settings.js
          grep -F 'const siteAreaCancel = button.id === "green-site-area-cancel";' feature-settings.js
          grep -F 'feature-settings.js?v=GREEN-EVG-OWNER-R1.9.2-20260922' owner.html
          git diff --check

      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO GREEN Evergreen Fix"
          git config user.email "actions@users.noreply.github.com"
          git rm -- ".github/workflows/dpro-green-r1-9-2-owner-cancel-fix.yml"
          git add feature-settings.js owner.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix GREEN R1.9.2 site area cancel and cache"
          git push origin HEAD:main
