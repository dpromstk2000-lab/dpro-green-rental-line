# DPRO GREEN R5.1: real PG17 test against GitHub Actions throwaway service ONLY.
# No checkout, repo contents, Supabase project or external service credentials.
name: DPRO GREEN R5.1 Disposable PostgreSQL 17 Atomic QA
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r51-disposable-pg17-atomic
  cancel-in-progress: false
jobs:
  r51-postgres17-atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: postgres:17
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_USER: isolated_qa
          POSTGRES_PASSWORD: synthetic_only_ci_password_2026
          POSTGRES_DB: green_r51_isolated
        options: >-
          --health-cmd "pg_isready -U isolated_qa -d green_r51_isolated"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: pg
      PGPORT: '5432'
      PGUSER: isolated_qa
      PGPASSWORD: synthetic_only_ci_password_2026
      PGDATABASE: green_r51_isolated
    steps:
      - name: Verify source and run isolated PostgreSQL 17 security and atomic QA
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS:-}" == 'true' ]] || exit 65
          [[ "${PGHOST:-}" == 'pg' ]] || exit 65
          [[ "${PGDATABASE:-}" == 'green_r51_isolated' ]] || exit 65
