name: DPRO GREEN R1.9.1 Owner Cancel Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-green-r1-9-1-owner-cancel-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply minimal R1.9.1 patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("feature-settings.js")
          text = path.read_text(encoding="utf-8")

          old = '''    const form = $("#green-site-area-edit-form", dialog);
              const save = $("#green-site-area-save", dialog);

              save?.addEventListener("click", async () => {'''

          new = '''    const form = $("#green-site-area-edit-form", dialog);
              const save = $("#green-site-area-save", dialog);
              const cancel = $("[data-dialog-close]", dialog);

              // R1.9.1: this footer is replaced after owner.js binds its close handlers.
              // Bind the dynamic cancel button so confirmed unsaved discard closes the dialog.
              cancel?.addEventListener("click", () => dialog.close());

              save?.addEventListener("click", async () => {'''

          if new in text:
              print("R1.9.1 cancel fix is already present.")
          else:
              if old not in text:
                  raise SystemExit("ABORT: expected R1.9 site-area editor block was not found; no file changed.")
              text = text.replace(old, new, 1)

          text = text.replace(
              'GREEN-EVERGREEN-OWNER-R1.9-20260922',
              'GREEN-EVERGREEN-OWNER-R1.9.1-20260922',
              1,
          )
          text = text.replace(
              'OWNER COMMON BRUSHUP R1.9 / 2026-09-22',
              'OWNER COMMON BRUSHUP R1.9.1 / 2026-09-22',
              1,
          )

          path.write_text(text, encoding="utf-8")

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'GREEN-EVERGREEN-OWNER-R1.9.1-20260922' feature-settings.js
          grep -F 'cancel?.addEventListener("click", () => dialog.close());' feature-settings.js
          git diff --check

      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO GREEN Evergreen Fix"
          git config user.email "actions@users.noreply.github.com"
          git rm -- ".github/workflows/dpro-green-r1-9-1-owner-cancel-fix.yml"
          git add feature-settings.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix GREEN R1.9.1 site area cancel close"
          git push origin HEAD:main
