name: DPRO GREEN R4.5 Private Preflight RPC Local Supabase QA
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r45-private-preflight-qa
  cancel-in-progress: false
jobs:
  r45-local-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.121.0
      - name: Ensure psql client exists
        shell: bash
        run: if ! command -v psql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
      - name: Run isolated R45 preflight and R44 atomic issuer (no hosted secrets)
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS:-}" == 'true' ]] || { echo 'Actions only'; exit 60; }
          qa_dir="$(mktemp -d)"
          trap 'rm -rf "$qa_dir"' EXIT
          cd "$qa_dir"
          cat > qa_payload.b64 <<'R45_EMBEDDED_QA'
