name: DPRO GREEN R3.9 Additive Schema-Only PostgreSQL QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r39-${{ github.ref }}
  cancel-in-progress: true
jobs:
  r39-additive-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-r39-only
          POSTGRES_DB: green_r39_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d green_r39_disposable"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-r39-only
      PGDATABASE: green_r39_disposable
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Restore integrity-checked synthetic source (no checkout, no secrets)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          cat > qa/r39-manifest.json <<'R39_QA_PAYLOAD'
          {"00_R39_DISPOSABLE_GENERAL_FIXTURE.sql":{"gzip_b64":"","sha256":"37afe969b2f3931c101559c8f56edc83ca36a251208b18bd05fb9b078a6f344a"},"01_R39_STAGING_SCHEMA_ONLY_REVIEW.sql":{"gzip_b64":"","sha256":"4b5104aba9b004406447e4b59c109bb1b84980d2b12264786b4aa7b7101752fe"},"02_R39_ASSERTIONS_PG17.sql":{"gzip_b64":"","sha256":"ee32e2a0e9a0bae2e2b3d970ee8aeeffc267b3ded7cdc51791eb7b6fba561dca"},"03_RUN_R39_PG17.sh":{"gzip_b64":"","sha256":"cf690093cfeb8406b6942f8042555e1cc5f525319aabbfaeee26d5722c3eb559"},"test-r39-static.mjs":{"gzip_b64":"","sha256":"26413f35117c89c1b5f0091ff4365b0370c81f9567484b2ccc3b519faeafd4b4"},"green-r38-release-gates.mjs":{"gzip_b64":"","sha256":"0fbcf933563045a4bf1cbed5d729960c95bc205ea8e4fe6576c25df2a113f9b7"},"R38_CURRENT_GENERAL_METADATA.json":{"gzip_b64":"","sha256":"0028e33d6cdaf27fd69c18b900c6b21ed92014a7e15c047eb2950d545d9d6f1b"},"test-r38-release-gates.mjs":{"gzip_b64":"","sha256":"20abf501b6a0c47745b5c76f1d621c80dd2b3796ae26476c9d8f737399fa80a5"}}
          R39_QA_PAYLOAD
          python3 - <<'PYRESTORE'
          import base64,gzip,hashlib,json,pathlib
          root=pathlib.Path('qa')
          manifest=json.loads((root/'r39-manifest.json').read_text())
          for name,item in manifest.items():
              if '/' in name or '..' in name: raise RuntimeError('Invalid source path')
              source=gzip.decompress(base64.b64decode(item['gzip_b64']))
              if hashlib.sha256(source).hexdigest()!=item['sha256']: raise RuntimeError('Integrity mismatch '+name)
              (root/name).write_bytes(source)
          print('Verified R3.9 synthetic bundle',len(manifest),'files')
          PYRESTORE
      - name: R3.9 static security checks + R3.8 regression
        run: |
          node qa/test-r39-static.mjs
          node qa/test-r38-release-gates.mjs
      - name: PostgreSQL 17 staged additive schema and denial tests
        shell: bash
        run: |
          bash qa/03_RUN_R39_PG17.sh
          echo '### R3.9 disposable PostgreSQL 17: additive 5-table schema, permission denials, no RPC, PHOTO rows retained, 28 new static + 81 R3.8 regression PASS. NO PRODUCTION MUTATION. Schema-only still BLOCKED for real onboarding.' >> "$GITHUB_STEP_SUMMARY"
