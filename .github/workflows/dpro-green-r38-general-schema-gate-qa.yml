name: DPRO GREEN R3.8 GENERAL Schema Gate Synthetic QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r38-offline-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Offline metadata gate (NO DB or credentials)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          cat > qa/manifest.json <<'R38_PAYLOAD'
          {"green-r38-release-gates.mjs":{"base64":"","sha256":"0fbcf933563045a4bf1cbed5d729960c95bc205ea8e4fe6576c25df2a113f9b7"},"test-r38-release-gates.mjs":{"base64":"","sha256":"20abf501b6a0c47745b5c76f1d621c80dd2b3796ae26476c9d8f737399fa80a5"},"R38_CURRENT_GENERAL_METADATA.json":{"base64":"","sha256":"0028e33d6cdaf27fd69c18b900c6b21ed92014a7e15c047eb2950d545d9d6f1b"}}
          R38_PAYLOAD
          python3 - <<'PYCODE'
          import base64,gzip,hashlib,json,pathlib
          manifest=json.loads(pathlib.Path('qa/manifest.json').read_text())
          for name,v in manifest.items():
              if '/' in name or '..' in name: raise RuntimeError('unsafe filename')
              blob=gzip.decompress(base64.b64decode(v['base64']))
              if hashlib.sha256(blob).hexdigest()!=v['sha256']: raise RuntimeError('integrity check failure')
              pathlib.Path('qa',name).write_bytes(blob)
          print('R3.8 archive SHA-256 verified')
          PYCODE
          node qa/test-r38-release-gates.mjs
          echo '### R3.8 metadata-only guard: 81 tests PASS; GENERAL BLOCKED as expected; NO production mutation' >> "$GITHUB_STEP_SUMMARY"
