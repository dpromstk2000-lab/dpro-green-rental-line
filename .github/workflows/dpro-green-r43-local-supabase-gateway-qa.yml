name: DPRO GREEN R4.3 Local Supabase Gateway and Auth Role Isolated QA
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: dpro-green-r43-supabase-local-gate
  cancel-in-progress: false
jobs:
  r43-local-supabase:
    name: r43-local-supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Supabase CLI pinned
      uses: supabase/setup-cli@v3.0.1
      with:
        version: 2.121.0
    - name: Make sure psql client exists
      shell: bash
      run: if ! command -v psql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
    - name: Run isolated synthetic local gateway role checks
      shell: bash
      run: 'set -euo pipefail

        if [[ "${GITHUB_ACTIONS:-}" != "true" ]]; then echo ''Refused outside Actions''; exit 45; fi

        # No checkout, project link, production secret, or environment secrets.

