name: DPRO GREEN R4.3.1 Local Supabase CLI Status Flag Fix QA
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: dpro-green-r431-supabase-local-gate
  cancel-in-progress: false
jobs:
  r43-local-supabase:
    name: r43-local-supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Supabase CLI pinned
      uses: supabase/setup-cli@v3.0.1
      with:
        version: 2.121.0
    - name: Make sure psql client exists
      shell: bash
      run: if ! command -v psql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
