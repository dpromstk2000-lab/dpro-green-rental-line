<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#12382d"><title>営業前デモ準備・システム確認</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="system-check.css"></head><body><section class="check-login" id="check-login"><form id="check-login-form"><p class="eyebrow">INTERNAL SYSTEM CHECK</p><h1>営業前デモ準備・システム確認</h1><p>この画面は開発・営業準備用です。通常の店舗運用には使用しません。</p><label>事業所コード<input id="check-facility" required></label><label>管理コード<span class="check-code"><input id="check-code" type="password" inputmode="numeric" required><button type="button" id="check-clear">削除</button></span></label><p id="check-login-error" class="form-error" hidden></p><button class="btn btn--primary" type="submit">ログイン</button></form></section><main class="check-app" id="check-app" hidden><header><div><p class="eyebrow">GREEN-10 INTERNAL</p><h1>営業前デモ準備・システム確認</h1></div><div><button class="btn btn--secondary" id="check-rerun">一括再検査</button><button class="btn btn--secondary" id="check-logout">ログアウト</button></div></header><section class="check-summary" id="check-summary"></section><section class="check-layout"><article class="check-panel"><h2>一括検査</h2><div id="check-list"></div></article><article class="check-panel demo-panel"><h2>デモ基本データを準備</h2><p>対象が <code>dpro_green_rental_demo</code> であることを確認し、安定したデモコードで不足・更新データをupsertします。本番データや他システムは変更しません。</p><label class="check-confirm"><input id="demo-confirmed" type="checkbox">対象が dpro_green_rental_demo であることを確認しました。</label><label>確認文字<input id="demo-text" placeholder="DEMO" autocomplete="off"></label><button class="btn btn--primary" id="demo-prepare">デモ基本データを準備</button><p id="demo-result"></p><hr><h3>公開画面・必須ファイル</h3><div id="page-checks"></div></article></section></main><div id="toast-region" class="toast-region" aria-live="polite"></div><script src="config.js"></script><script src="green-common.js"></script><script src="system-check.js"></script></body></html>
