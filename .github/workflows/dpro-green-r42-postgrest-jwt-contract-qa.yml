name: DPRO GREEN R4.2 PostgREST JWT Claim Isolated QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r42-http
  cancel-in-progress: false
jobs:
  r42-pg17-postgrest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only-password
          POSTGRES_DB: green_r42_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d green_r42_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Run disposable PG17 with standalone PostgREST v16.4
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: green_r42_disposable
          PGUSER: postgres
          PGPASSWORD: synthetic-only-password
