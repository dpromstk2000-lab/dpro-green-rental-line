name: DPRO GREEN R3.1 Disposable General Onboarding PostgreSQL QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r31-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-general-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-r31-only
          POSTGRES_DB: green_r31_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d green_r31_disposable"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-r31-only
      PGDATABASE: green_r31_disposable
    steps:
      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Verify bundle SHA-256 and run disposable PG17 tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/green-r31"
