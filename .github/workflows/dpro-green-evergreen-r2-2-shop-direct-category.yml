name: DPRO GREEN EVERGREEN R2.2 Shop Direct Category

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-green-evergreen-r2-2-shop-direct-category.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify R2.1 FACT LOCK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object green-shop-owner.js)" = "aa5c8d956d4241ef9cca52a1bed604701391b980"
          test "$(git hash-object config.js)" = "ac5b5fa3a5b16ea0a583e7c6fad96b579e170480"
          test "$(git hash-object owner.html)" = "fed2c9e08e26b42fb1e528a0b1653616f3881b9e"
          echo "FACT LOCK OK"

      - name: Apply direct SHOP category integration
        shell: bash
        env:
          DPRO_PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$DPRO_PATCH_B64" | base64 --decode > /tmp/dpro_green_r2_2_patch.py
          python /tmp/dpro_green_r2_2_patch.py

      - name: Verify R2.2 files
        shell: bash
        run: |
          set -euo pipefail
          node --check green-shop-owner.js
          grep -F 'GREEN-SHOP-OWNER-R1.3-20260923' green-shop-owner.js
          grep -F 'const FEATURE_GROUP = "販売・SHOP";' green-shop-owner.js
          grep -F 'syncFeatureCategory' green-shop-owner.js
          grep -F 'card.dataset.featureGroup=FEATURE_GROUP' green-shop-owner.js
          grep -F 'GREEN-SHOP-OWNER-R1.3-20260923' config.js
          grep -F 'config.js?v=GREEN-EVG-R2.2-20260923' owner.html
          if grep -Fq 'green-shop-category-r2.js' owner.html; then
            echo "ABORT: obsolete bridge script still loaded"
            exit 1
          fi
          git diff --check

      - name: Commit application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO GREEN Evergreen"
          git config user.email "actions@users.noreply.github.com"
          git add green-shop-owner.js config.js owner.html
          git commit -m "Integrate GREEN shop directly into settings categories"
          git push origin HEAD:main
