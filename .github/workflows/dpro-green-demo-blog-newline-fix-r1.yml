name: DPRO GREEN Demo Blog Newline Fix R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visible newline artifacts
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os, base64
          exec(compile(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"),"newline_fix.py","exec"))
      - name: Validate
        shell: bash
        run: |
          ! grep -Fq '\n</head>' owner.html
          ! grep -Fq '</button>\n' owner.html
          ! grep -Fq '\n        <section class="owner-view" data-view-panel="features">' owner.html
          ! grep -Fq '</script>\n</body>' owner.html
          grep -q 'data-view="blog"' owner.html
          grep -q 'data-view-panel="blog"' owner.html
      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/dpro-green-demo-blog-newline-fix-r1.yml
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove visible newline artifacts from GREEN demo blog"
          git push
