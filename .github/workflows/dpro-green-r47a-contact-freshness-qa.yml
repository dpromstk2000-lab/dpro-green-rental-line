name: DPRO GREEN R4.7A Contact Freshness Isolated QA
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r47a-local-orchestration
  cancel-in-progress: false
jobs:
  r47-local-orchestration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.121.0
      - name: Ensure local PostgreSQL client
        shell: bash
        run: if ! command -v psql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
      - name: Run isolated CENTRAL to GENERAL and delivery QA
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS:-}" == 'true' ]] || { echo 'GitHub Actions only'; exit 65; }
