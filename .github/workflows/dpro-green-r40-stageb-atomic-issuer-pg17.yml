name: DPRO GREEN R4.0 Stage-B Atomic Issuer PG17 QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r40-${{ github.ref }}
  cancel-in-progress: true
jobs:
  r40-isolated-atomic-issuer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-r40-local-only
          POSTGRES_DB: green_r40_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d green_r40_disposable"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-r40-local-only
      PGDATABASE: green_r40_disposable
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Restore verified synthetic sources (no repository checkout or secrets)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          cat > qa/r40-manifest.json <<'R40_EMBEDDED_MANIFEST'
          {"00_R39_DISPOSABLE_GENERAL_FIXTURE.sql":{"gzip_b64":"","sha256":"37afe969b2f3931c101559c8f56edc83ca36a251208b18bd05fb9b078a6f344a"},"00_R40_TEST_FIXTURE_EXTEND.sql":{"gzip_b64":"","sha256":"e60fd727e7eebcd748377892dbfb06f240f9f54c059ec39bb098e0f2a5c8797e"},"01_R39_STAGING_SCHEMA_ONLY_REVIEW.sql":{"gzip_b64":"","sha256":"4b5104aba9b004406447e4b59c109bb1b84980d2b12264786b4aa7b7101752fe"},"01_R40_STAGING_RPC_REVIEW_ONLY.sql":{"gzip_b64":"","sha256":"076b3b911a5ea8265c66a7ad81fc3f82af3f00056629b1a8cb68a1bf38f77372"},"02_R39_ASSERTIONS_PG17.sql":{"gzip_b64":"","sha256":"ee32e2a0e9a0bae2e2b3d970ee8aeeffc267b3ded7cdc51791eb7b6fba561dca"},"02_R40_RPC_QA_PG17.sql":{"gzip_b64":"","sha256":"e87ddbd317bbb3d7c5baf2a95e519520ac855d9c84c0c81f8efed800cd49c63a"},"03_RUN_R39_PG17.sh":{"gzip_b64":"","sha256":"cf690093cfeb8406b6942f8042555e1cc5f525319aabbfaeee26d5722c3eb559"},"03_RUN_R40_STAGING_PG17.sh":{"gzip_b64":"","sha256":"263636203d4f6b20458d804f46b4566b09dc36e0b8224c898844c2d756186c5e"},"R38_CURRENT_GENERAL_METADATA.json":{"gzip_b64":"","sha256":"0028e33d6cdaf27fd69c18b900c6b21ed92014a7e15c047eb2950d545d9d6f1b"},"green-r38-release-gates.mjs":{"gzip_b64":"","sha256":"0fbcf933563045a4bf1cbed5d729960c95bc205ea8e4fe6576c25df2a113f9b7"},"test-r38-release-gates.mjs":{"gzip_b64":"","sha256":"20abf501b6a0c47745b5c76f1d621c80dd2b3796ae26476c9d8f737399fa80a5"},"test-r39-static.mjs":{"gzip_b64":"","sha256":"26413f35117c89c1b5f0091ff4365b0370c81f9567484b2ccc3b519faeafd4b4"},"test-r40-static.mjs":{"gzip_b64":"","sha256":"32168af1ff94e9cebe9de2ab7d480e6d7c837a1f8c5e051853ab25f505574f93"}}
          R40_EMBEDDED_MANIFEST
          python3 - <<'RESTORE_R40'
          import base64,gzip,hashlib,json,pathlib
          root=pathlib.Path('qa')
          data=json.loads((root/'r40-manifest.json').read_text())
          for name,obj in data.items():
            if '/' in name or '..' in name: raise RuntimeError('invalid file path')
            content=gzip.decompress(base64.b64decode(obj['gzip_b64']))
            if hashlib.sha256(content).hexdigest()!=obj['sha256']: raise RuntimeError('sha256 mismatch: '+name)
            (root/name).write_bytes(content)
          print('R4.0 verified synthetic bundle:',len(data),'files')
          RESTORE_R40
      - name: Node offline gates - R3.8, R3.9 and R4.0
        shell: bash
        run: |
          set -euo pipefail
          node qa/test-r38-release-gates.mjs
          node qa/test-r39-static.mjs
          node qa/test-r40-static.mjs
      - name: Disposable PostgreSQL17 R3.9 plus R4.0 atomic issuer QA
        shell: bash
        run: |
          set -euo pipefail
          bash qa/03_RUN_R40_STAGING_PG17.sh
          echo '### R4.0 synthetic PASS: R3.8/R3.9 regressions, R3.9 five-table staging, R4.0 SECURITY DEFINER restricted issuer, permission denies, replay, rollback, PHOTO row survival and concurrent issue. NO LIVE SUPABASE, OWNER INVITES, SMS, GOOGLE, SQUARE OR WORKER DEPLOY. NOT APPROVED FOR PRODUCTION.' >> "$GITHUB_STEP_SUMMARY"
