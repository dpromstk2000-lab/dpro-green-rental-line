name: DPRO GREEN R2.6 Atomic Approval and Audit PostgreSQL QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dpro-green-r26-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-pg17-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-r26-only
          POSTGRES_DB: green_r26_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d green_r26_disposable"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-r26-only
      PGDATABASE: green_r26_disposable
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Expand checksum-verified synthetic fixture
