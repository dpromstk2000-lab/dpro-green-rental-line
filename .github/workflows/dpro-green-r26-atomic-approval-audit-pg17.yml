      - name: Run synthetic PostgreSQL 17 atomic approval SQL checks
        shell: bash
        run: bash "$RUNNER_TEMP/green-r26/R26_RUN_PG17.sh"
      - name: Run R2.6 audit timestamp compatibility regression
        shell: bash
        run: node "$RUNNER_TEMP/green-r26/test-r26-audit-timestamps.mjs"
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### DPRO GREEN R2.6 isolated approval+audit QA' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only synthetic PostgreSQL 17 database and Node mocks. No live Supabase, no owner invitations, no SMS, no Google OAuth, no Square payments or Worker Deploy.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PASS confirms synthetic SQL operation, NOT production authorization.' >> "$GITHUB_STEP_SUMMARY"
