name: DPRO GREEN DEMO FC Common Enable R49

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEMO
        uses: actions/checkout@v4

      - name: Verify deployed DEMO Worker R49
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://dpro-green-rental-line-api.dpromstk2000.workers.dev/api/health"
          EXPECTED_VERSION="GREEN-DEMO-FC-COMMON-R49-ATLAS-R1-20261004"
          EXPECTED_FACILITY="dpro_green_rental_demo"
          for n in 1 2 3 4 5 6; do
            if curl -fsS --connect-timeout 10 --max-time 20 "$HEALTH_URL" -o /tmp/green-health.json; then
              break
            fi
            sleep 5
          done
          python - <<'PY2'
          import json
          from pathlib import Path
          p=Path('/tmp/green-health.json')
          if not p.exists():
              raise SystemExit('DEMO Worker health response was not retrieved')
          data=json.loads(p.read_text())
          expected='GREEN-DEMO-FC-COMMON-R49-ATLAS-R1-20261004'
          if data.get('ok') is not True:
              raise SystemExit(f'Worker health is not OK: {data}')
          if data.get('version') != expected:
              raise SystemExit(f'Worker version mismatch: {data.get("version")} != {expected}')
          if data.get('facilityCode') != 'dpro_green_rental_demo':
              raise SystemExit(f'Facility mismatch: {data.get("facilityCode")}')
          if data.get('environment') != 'demo':
              raise SystemExit(f'Environment mismatch: {data.get("environment")}')
          print('Worker health PASS:', data.get('version'), data.get('facilityCode'), data.get('databaseVersion'))
          PY2
          curl -fsS --connect-timeout 10 --max-time 20 \
            "https://dpro-green-rental-line-api.dpromstk2000.workers.dev/api/public/services" \
            -o /tmp/green-services.json
          python - <<'PY2'
          import json
          data=json.load(open('/tmp/green-services.json'))
          if data.get('ok') is not True:
              raise SystemExit(f'Public services API not OK: {data}')
          print('Public services API PASS')
          PY2

      - name: Fetch locked production source
        shell: bash
        run: |
          rm -rf /tmp/green-prod
          git clone --quiet https://github.com/dpromstk2000-lab/dpro-cl-000001-green.git /tmp/green-prod
          git -C /tmp/green-prod checkout --quiet 58af787c2e6c664722dc1c52a6495f76b2ac7258

      - name: Copy remaining FC-common generic frontend
        shell: bash
        run: |
          set -euo pipefail
          for f in             green-final-brushup-r1.js             green-owner-pot-model-dedupe-r1.js             green-member-report-date-r1.js             member.html             staff.html             styles.css
          do
            test -f "/tmp/green-prod/$f"
            cp "/tmp/green-prod/$f" "$f"
          done

      - name: Write R49 capability loader
        shell: python
        env:
          GREEN_FC_R49_B64: ""
        run: |
          import os, base64
          from pathlib import Path
          Path("green-fc-common-demo-r49.js").write_bytes(base64.b64decode(os.environ["GREEN_FC_R49_B64"]))

      - name: Activate R49 loader and retire R48 activation
        shell: python
        run: |
          from pathlib import Path
          p=Path("config.js")
          s=p.read_text()
          old="green-fc-common-demo-r48.js?v=GREEN-DEMO-FC-COMMON-R48-20261004"
          new="green-fc-common-demo-r49.js?v=GREEN-DEMO-FC-COMMON-R49-20261004"
          if new not in s:
              if old not in s:
                  raise SystemExit("R48 loader activation not found in config.js")
              s=s.replace(old,new)
          p.write_text(s)

      - name: FC safety guard
        shell: bash
        run: |
          set -euo pipefail
          files="green-fc-common-demo-r49.js green-final-brushup-r1.js green-owner-pot-model-dedupe-r1.js green-member-report-date-r1.js member.html staff.html styles.css"
          if grep -nE 'cl_000001_green|2011750460-EpN149VY|dpro-cl-000001-green-(core|shop|line)|グリーン・ポケット福岡粕屋店|粕屋店' $files; then
            echo "Kasuya-specific identifier detected. Abort."
            exit 1
          fi
          grep -q 'FACILITY_CODE: "dpro_green_rental_demo"' config.js
          grep -q 'dpro-green-rental-line-api.dpromstk2000.workers.dev' config.js
          grep -q 'atlasImageWrite: true' green-fc-common-demo-r49.js
          grep -q 'staffAuthR1: true' green-fc-common-demo-r49.js
          grep -q 'shopV3Backend: false' green-fc-common-demo-r49.js

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check config.js
          node --check green-fc-common-demo-r49.js
          node --check green-final-brushup-r1.js
          node --check green-owner-pot-model-dedupe-r1.js
          node --check green-member-report-date-r1.js
          test "$(find . -maxdepth 1 -type f -name 'atlas-*.png' | wc -l | tr -d ' ')" -eq 96

      - name: Commit R49 FC-common enablement
        shell: bash
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js green-fc-common-demo-r49.js green-final-brushup-r1.js green-owner-pot-model-dedupe-r1.js green-member-report-date-r1.js member.html staff.html styles.css
          git commit -m "Enable GREEN DEMO FC common R49 capabilities"
          git push
