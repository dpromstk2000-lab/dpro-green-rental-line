name: DPRO GREEN EVERGREEN R2.1 Shop Category Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-green-evergreen-r2-1-shop-category.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify R2 FACT LOCK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^ 2>/dev/null || true)" != ""
          test "$(git hash-object owner.html)" = "3ea6a5f27e57b3b8f465a5eceaffe2b02cefed9c"
          echo "FACT LOCK OK"

      - name: Add shop category bridge
        shell: bash
        env:
          SHOP_CATEGORY_JS_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$SHOP_CATEGORY_JS_B64" | base64 --decode > green-shop-category-r2.js
          python - <<'PY'
          from pathlib import Path
          path = Path("owner.html")
          text = path.read_text(encoding="utf-8")
          old = '<script src="feature-settings.js?v=GREEN-EVG-OWNER-R2.0-20260923"></script>'
          new = old + '\n  <script src="green-shop-category-r2.js?v=GREEN-EVG-SHOP-CATEGORY-R2.1-20260923"></script>'
          if new in text:
              raise SystemExit("ABORT: shop category bridge already present")
          if text.count(old) != 1:
              raise SystemExit("ABORT: feature-settings script marker not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify files
        shell: bash
        run: |
          set -euo pipefail
          node --check green-shop-category-r2.js
          grep -F 'GREEN-EVERGREEN-SHOP-CATEGORY-R2.1-20260923' green-shop-category-r2.js
          grep -F 'const GROUP = "販売・SHOP";' green-shop-category-r2.js
          grep -F 'data-feature-group' green-shop-category-r2.js
          grep -F 'green-shop-category-r2.js?v=GREEN-EVG-SHOP-CATEGORY-R2.1-20260923' owner.html
          git diff --check

      - name: Commit application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO GREEN Evergreen"
          git config user.email "actions@users.noreply.github.com"
          git add green-shop-category-r2.js owner.html
          git commit -m "Align GREEN shop module with settings category UI"
          git push origin HEAD:main
