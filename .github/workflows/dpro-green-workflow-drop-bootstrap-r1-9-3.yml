name: DPRO GREEN Workflow Drop Bootstrap R1.9.3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-green-workflow-drop-bootstrap-r1-9-3.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply GREEN R1.9.3 active site-area filter
        shell: python
        run: |
          from pathlib import Path

          owner_js = Path("owner.js")
          owner_html = Path("owner.html")
          js = owner_js.read_text(encoding="utf-8")
          html = owner_html.read_text(encoding="utf-8")

          move_old = 'optionList(result.data.areas || [],"id",(i)=>i.area_name,asset.current_site_area_id,"設置場所を選択")'
          move_new = 'optionList((result.data.areas || []).filter((i)=>i.is_active !== false),"id",(i)=>i.area_name,asset.current_site_area_id,"設置場所を選択")'

          if move_old in js:
              js = js.replace(move_old, move_new, 1)
          elif move_new not in js:
              raise SystemExit("ABORT: asset movement site-area selector not found")

          install_old = 'optionList(siteResult.data.areas || [],"id",(i)=>i.area_name,"","設置場所を選択")'
          install_new = 'optionList((siteResult.data.areas || []).filter((i)=>i.is_active !== false),"id",(i)=>i.area_name,"","設置場所を選択")'

          old_count = js.count(install_old)
          if old_count == 2:
              js = js.replace(install_old, install_new, 2)
          elif js.count(install_new) < 2:
              raise SystemExit(f"ABORT: expected 2 installation site-area selectors, found {old_count}")

          version_comment = '  // DPRO GREEN PRODUCT EVERGREEN OWNER UI R1.9.3 / active site-area filter / 2026-09-22\n'
          if version_comment not in js:
              marker = '  "use strict";\n'
              if marker not in js:
                  raise SystemExit("ABORT: owner.js marker not found")
              js = js.replace(marker, marker + version_comment, 1)

          old_script = '<script src="owner.js"></script>'
          new_script = '<script src="owner.js?v=GREEN-EVG-OWNER-R1.9.3-20260922"></script>'
          if old_script in html:
              html = html.replace(old_script, new_script, 1)
          elif new_script not in html:
              raise SystemExit("ABORT: owner.js script tag not found")

          owner_js.write_text(js, encoding="utf-8")
          owner_html.write_text(html, encoding="utf-8")

      - name: Create permanent workflow-folder keeper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/dpro-workflow-folder-keeper.yml <<'YAML'
          name: DPRO Workflow Folder Keeper

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            keep:
              runs-on: ubuntu-latest
              steps:
                - name: Keep DPRO workflow upload folder available
                  run: echo "This manual-only workflow keeps .github/workflows available for DPRO drag-and-drop uploads."
          YAML

      - name: Verify patch and permanent drop mode
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'DPRO GREEN PRODUCT EVERGREEN OWNER UI R1.9.3' owner.js
          test "$(grep -o 'filter((i)=>i.is_active !== false)' owner.js | wc -l)" -ge 3
          grep -F 'owner.js?v=GREEN-EVG-OWNER-R1.9.3-20260922' owner.html
          grep -F 'name: DPRO Workflow Folder Keeper' .github/workflows/dpro-workflow-folder-keeper.yml
          git diff --check

      - name: Remove bootstrap and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO GREEN Evergreen Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git rm -- ".github/workflows/dpro-green-workflow-drop-bootstrap-r1-9-3.yml"
          git add owner.js owner.html .github/workflows/dpro-workflow-folder-keeper.yml
          git commit -m "Enable GREEN workflow drop mode and fix R1.9.3 active areas"
          git push origin HEAD:main
