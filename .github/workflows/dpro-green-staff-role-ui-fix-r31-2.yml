name: DPRO GREEN Staff Role UI Fix R31.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-green-staff-role-ui-fix-r31-2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify FACT LOCK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object green-staff-management-r31.js)" = "e3dc4bafe77708abcff282057be9e3bf6c581491"
          test "$(git hash-object config.js)" = "c8bac14a8d534cda07b594b8c0a8e4af478ad3fc"
          echo "FACT LOCK OK"

      - name: Apply checkbox and role layout fix
        shell: bash
        env:
          DPRO_PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$DPRO_PATCH_B64" | base64 --decode > /tmp/dpro_green_staff_role_ui_fix.py
          python /tmp/dpro_green_staff_role_ui_fix.py

      - name: Verify files
        shell: bash
        run: |
          set -euo pipefail
          node --check green-staff-management-r31.js
          grep -F 'GREEN-STAFF-MANAGEMENT-R31.2-20260923' green-staff-management-r31.js
          grep -F 'grid-template-columns:repeat(3,minmax(0,1fr))' green-staff-management-r31.js
          grep -F 'input[type="checkbox"]' green-staff-management-r31.js
          grep -F 'GREEN-STAFF-MANAGEMENT-R31.2-20260923' config.js
          git diff --check

      - name: Commit application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO GREEN Evergreen"
          git config user.email "actions@users.noreply.github.com"
          git add green-staff-management-r31.js config.js
          git commit -m "Fix GREEN staff role checkbox layout"
          git push origin HEAD:main
