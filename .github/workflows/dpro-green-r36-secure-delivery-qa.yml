      - name: Run R3.6 delivery boundary and R3.5 regression
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/green-r36
          total=0
          for f in test-r36-delivery-boundary.mjs test-r35-additive-preflight.mjs test-r33-composed-receiver.mjs test-r33-general-adapters.mjs test-r30-general-adapters.mjs test-r30-tenant-receiver.mjs; do
            node "$f" > "/tmp/green-r36-$f.log" 2>&1 || { cat "/tmp/green-r36-$f.log"; exit 1; }
            count=$(grep -c '^PASS ' "/tmp/green-r36-$f.log")
            echo "$f: $count PASS"
            total=$((total + count))
          done
          test "$total" -eq 118
          echo '### DPRO GREEN R3.6 ISOLATED PASS — 13 new delivery checks + 105 regression = 118' >> "$GITHUB_STEP_SUMMARY"
          echo 'No live database, credentials, invitations, SMTP/SMS, Google, Square, worker deploy or production writes. NOT a production approval.' >> "$GITHUB_STEP_SUMMARY"
